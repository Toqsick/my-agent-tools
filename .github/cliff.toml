# git-cliff configuration for Toqsick/my-agent-tools
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """# Changelog\n
All notable changes to this project will be documented in this file.\n
Generated by [git-cliff](https://github.com/orhun/git-cliff).\n"""
body = """
{% if version %}\n## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}\n{% else %}\n## [Unreleased]\n{% endif %}\n\
{% for group, commits in commits | group_by(attribute="group") %}\
    ### {{ group | upper_first }}\n\
    {% for commit in commits %}\
        - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/Toqsick/my-agent-tools/commit/{{ commit.id }}))\n\
    {% endfor %}\n\
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat",     group = "Features" },
    { message = "^fix",      group = "Bug Fixes" },
    { message = "^docs",     group = "Documentation" },
    { message = "^chore",    group = "Maintenance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^perf",     group = "Performance" },
    { message = "^test",     group = "Testing" },
    { message = "^ci",       group = "CI/CD" },
    { message = "^skip ci",  skip = true },
    { message = "\\[skip ci\\]", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
