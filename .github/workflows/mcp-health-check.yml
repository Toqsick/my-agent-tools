name: MCP Server Health Check

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/agent-toolkit/.mcp.json'
      - '.env.example'
      - 'scripts/check-mcp.sh'
      - '.github/workflows/mcp-health-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'plugins/agent-toolkit/.mcp.json'
      - '.env.example'
      - 'scripts/check-mcp.sh'
  schedule:
    # Daily at 07:00 CEST (05:00 UTC) — morning briefing readiness check
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      full_check:
        description: 'Run full check including npx package resolution'
        required: false
        default: 'true'
        type: boolean

jobs:
  # ----------------------------------------------------------------
  # Job 1: Validate .mcp.json structure
  # ----------------------------------------------------------------
  validate-config:
    name: Validate .mcp.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          echo "Validating plugins/agent-toolkit/.mcp.json..."
          python3 -c "
import json, sys
try:
    with open('plugins/agent-toolkit/.mcp.json') as f:
        cfg = json.load(f)
    servers = cfg.get('mcpServers', {})
    print(f'  ✅ Valid JSON — {len(servers)} servers declared')
    for name, conf in servers.items():
        cmd = conf.get('command', 'MISSING')
        args = conf.get('args', [])
        print(f'  🔹 {name}: {cmd} {" ".join(str(a) for a in args[:3])}')
except Exception as e:
    print(f'  ❌ JSON parse error: {e}')
    sys.exit(1)
"

      - name: Check all servers have command + args
        run: |
          python3 -c "
import json, sys
with open('plugins/agent-toolkit/.mcp.json') as f:
    cfg = json.load(f)
servers = cfg.get('mcpServers', {})
errors = []
for name, conf in servers.items():
    if 'command' not in conf:
        errors.append(f'{name}: missing command')
    if 'args' not in conf:
        errors.append(f'{name}: missing args')
    # Ensure no hardcoded secrets (no token/key literals)
    env = conf.get('env', {})
    for k, v in env.items():
        if v and not str(v).startswith('\${'):
            errors.append(f'{name}.env.{k}: hardcoded value detected! Use \${{{k}}} instead.')
if errors:
    for e in errors: print(f'  ❌ {e}')
    sys.exit(1)
print(f'  ✅ All {len(servers)} server configs valid — no hardcoded secrets')
"

      - name: Validate .env.example completeness
        run: |
          python3 -c "
import json, re, sys

# Collect all env var names from .mcp.json
with open('plugins/agent-toolkit/.mcp.json') as f:
    cfg = json.load(f)
required_vars = set()
for name, conf in cfg.get('mcpServers', {}).items():
    for k, v in conf.get('env', {}).items():
        # Extract var name from \${VAR_NAME}
        match = re.match(r'\\\${([^}]+)}', str(v))
        if match:
            required_vars.add(match.group(1))

# Check .env.example covers all of them
with open('.env.example') as f:
    content = f.read()
example_vars = set(re.findall(r'^([A-Z_]+)=', content, re.MULTILINE))

missing = required_vars - example_vars
if missing:
    print(f'  ❌ .env.example missing vars: {missing}')
    sys.exit(1)
print(f'  ✅ .env.example covers all {len(required_vars)} required env vars')
"

  # ----------------------------------------------------------------
  # Job 2: Check runtime dependencies & npx packages
  # ----------------------------------------------------------------
  check-dependencies:
    name: Check Node + npx packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check npx packages exist on npm registry
        run: |
          echo "Checking npm registry for all npx-based MCP packages..."
          PACKAGES=(
            "@gongrzhe/server-gmail-autoauth-mcp"
            "@cocal/google-calendar-mcp"
            "@modelcontextprotocol/server-filesystem"
            "@modelcontextprotocol/server-brave-search"
            "@modelcontextprotocol/server-memory"
            "@modelcontextprotocol/server-puppeteer"
            "@modelcontextprotocol/server-sequential-thinking"
          )
          FAILED=0
          for PKG in "${PACKAGES[@]}"; do
            VERSION=$(npm view "$PKG" version 2>/dev/null)
            if [ -n "$VERSION" ]; then
              echo "  ✅ $PKG@$VERSION"
            else
              echo "  ❌ $PKG — NOT FOUND on npm registry"
              FAILED=$((FAILED+1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "$FAILED package(s) not found on npm. Update .mcp.json package names."
            exit 1
          fi

  # ----------------------------------------------------------------
  # Job 3: Check Docker image exists
  # ----------------------------------------------------------------
  check-docker-image:
    name: Check Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check toqsick/github-mcp-server:develop on Docker Hub
        run: |
          echo "Checking Docker Hub for toqsick/github-mcp-server:develop..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/toqsick/github-mcp-server/tags/develop")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "  ✅ toqsick/github-mcp-server:develop exists on Docker Hub"
          else
            echo "  ⚠️  Docker Hub returned HTTP $HTTP_STATUS"
            echo "  The image may be private or the tag may have changed."
            echo "  Verify: https://hub.docker.com/r/toqsick/github-mcp-server/tags"
            # Warning only — private images return 401/404 but still exist
          fi

  # ----------------------------------------------------------------
  # Job 4: Script syntax check
  # ----------------------------------------------------------------
  check-script:
    name: Validate check-mcp.sh syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on check-mcp.sh
        run: |
          shellcheck -S warning scripts/check-mcp.sh
          echo "  ✅ check-mcp.sh passes shellcheck"

      - name: Check script is executable (or can be made so)
        run: |
          bash -n scripts/check-mcp.sh
          echo "  ✅ check-mcp.sh syntax valid"

  # ----------------------------------------------------------------
  # Job 5: Summary
  # ----------------------------------------------------------------
  summary:
    name: Health Check Summary
    runs-on: ubuntu-latest
    needs: [validate-config, check-dependencies, check-docker-image, check-script]
    if: always()
    steps:
      - name: Print result
        run: |
          echo "## MCP Health Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| .mcp.json validation | ${{ needs.validate-config.result == 'success' && '✅ passed' || '❌ failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npx packages (Node 18/20/22) | ${{ needs.check-dependencies.result == 'success' && '✅ passed' || '❌ failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker image | ${{ needs.check-docker-image.result == 'success' && '✅ passed' || '⚠️ warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Script syntax | ${{ needs.check-script.result == 'success' && '✅ passed' || '❌ failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Triggered: ${{ github.event_name }} · $(date -u '+%Y-%m-%d %H:%M UTC')_" >> $GITHUB_STEP_SUMMARY
