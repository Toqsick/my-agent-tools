desc-en: "For anime-style image generation across 14 substyles including modern moe, Showa cel shading, Ghibli watercolor, Shinkai lighting, Donghua wuxia, Manhwa webtoon, US cartoon, chibi and cyberpunk anime aesthetics. Takes character description, style preference and optional reference image as input. Produces anime images with character lock for identity consistency, facial proportion rules and style coherence across multiple generations."
desc-cn: "适用于二次元及动漫风格的图片生成,覆盖 14 种子风格:日漫现代萌系、昭和赛璐璐、吉卜力水彩、新海诚光影、国漫仙侠水墨、韩漫 webtoon、美漫卡通、Q 版、二次元赛博朋克等。输入角色描述、画风偏好与可选参考图,输出锁定画风、保持角色身份一致的二次元图像,遵循面部比例规则,确保多次生成间的风格连贯性。"
